<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>一天漫想筆記</title>
<meta name="theme-color" content="#0E6A73">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="漫想筆記">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>html{padding-top:env(safe-area-inset-top,0px)}body{margin:0}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;800&display=swap">
<style>
:root{
  --bg:#EDF2F1; --surface:#FAFCFB; --ink:#17282C; --muted:#586E73; --line:#D0DCDA;
  --accent:#0E6A73; --accent-ink:#FFFFFF; --accent-soft:#DCEBEA;
  --mark:#B8661A; --mark-soft:#F6E4CE;
  --fixed:#0E6A73; --prep:#5B6FA0; --buffer:#4E8760; --gap:#8A6D1F;
  --danger:#B23A3A;
  --serif:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --sans:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1719; --surface:#152124; --ink:#E4EEEC; --muted:#93A9AD; --line:#26393D;
    --accent:#4FB8C2; --accent-ink:#06191B; --accent-soft:#183036;
    --mark:#F0A24F; --mark-soft:#3A2A15;
    --fixed:#4FB8C2; --prep:#8EA2D4; --buffer:#7BC08E; --gap:#D9B85A;
    --danger:#E58585;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1719; --surface:#152124; --ink:#E4EEEC; --muted:#93A9AD; --line:#26393D;
  --accent:#4FB8C2; --accent-ink:#06191B; --accent-soft:#183036;
  --mark:#F0A24F; --mark-soft:#3A2A15;
  --fixed:#4FB8C2; --prep:#8EA2D4; --buffer:#7BC08E; --gap:#D9B85A;
  --danger:#E58585;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:0 96px;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin-inline:auto}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.top-in{max-width:560px;margin-inline:auto;display:flex;align-items:center;gap:8px}
.datebox{flex:1;min-width:0;display:flex;flex-direction:column}
.date{font-family:var(--serif);font-weight:800;font-size:22px;line-height:1.2}
.sub{font-size:12px;color:var(--muted);letter-spacing:.04em}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.todaybtn{height:44px;padding-inline:14px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-size:14px}

/* main */
main{padding-block:20px 8px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0}
h2{font-size:24px;line-height:1.35;font-weight:800}
.stepno{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:700;text-transform:uppercase}
.lead{margin:0;color:var(--muted);font-size:15px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--mark-soft);border:1px solid var(--mark);border-radius:10px;padding:10px 12px;font-size:14px}
.banner button{flex:none;border:1px solid var(--mark);background:transparent;border-radius:8px;min-height:36px;padding-inline:12px;color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.row-form{display:flex;gap:8px}
.row-form input[type=text]{flex:1;min-width:0}
input[type=text],input[type=time],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{resize:vertical;min-height:72px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
.btn{min-height:44px;padding-inline:16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;flex:none}
.btn.ghost{background:transparent;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding-inline:12px;border-radius:19px;border:1px dashed var(--line);background:transparent;font-size:14px;color:var(--ink)}
.chip:active{background:var(--accent-soft)}
.label{font-size:12px;color:var(--muted);letter-spacing:.06em}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 14px;min-height:52px}
.item .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.del{width:40px;height:40px;border:0;background:transparent;border-radius:8px;color:var(--muted);font-size:20px;line-height:1;flex:none}
.del:hover{color:var(--danger)}

/* pick top three */
.pick{width:100%;text-align:left;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:52px}
.pick .ring{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--serif);font-weight:800;font-size:15px;flex:none}
.pick[aria-pressed=true]{border-color:var(--mark);background:var(--mark-soft)}
.pick[aria-pressed=true] .ring{border-color:var(--mark);background:var(--mark);color:var(--surface)}
.pick[aria-disabled=true]{opacity:.5}
.counter{font-family:var(--serif);font-weight:800;font-size:32px;color:var(--mark);line-height:1}

/* timeline */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg label{display:block}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:grid;place-items:center;min-height:44px;border:1px solid var(--line);border-radius:10px;font-size:14px;text-align:center;padding-inline:4px;background:var(--bg)}
.seg input:checked+span{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.times{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.times label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:start;padding-block:10px;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .t{font-variant-numeric:tabular-nums;font-size:14px;line-height:1.4;color:var(--muted)}
.ev .t b{display:block;color:var(--ink);font-weight:700}
.ev .body{min-width:0;overflow-wrap:anywhere;border-left:3px solid var(--fixed);padding-left:10px}
.ev.prep .body{border-color:var(--prep)}
.ev.buffer .body{border-color:var(--buffer)}
.ev.gap .body{border-color:var(--gap);border-left-style:dashed}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;color:var(--muted);margin-right:6px}
.warn{color:var(--danger);font-size:12px}

/* gaps */
.gapcard{display:flex;flex-direction:column;gap:8px}
.gaphead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.gaphead b{font-variant-numeric:tabular-nums}
.gaphead span{color:var(--gap);font-size:13px;font-weight:700}

/* review */
.stat{display:flex;align-items:baseline;gap:8px}
.stat .n{font-family:var(--serif);font-weight:800;font-size:36px;line-height:1;color:var(--buffer)}
.q{display:flex;flex-direction:column;gap:6px}
.q h3{margin:0;font-size:16px;font-weight:700}

/* map */
.done{display:flex;align-items:center;gap:12px;min-height:48px}
.done input{width:22px;height:22px;accent-color:var(--mark);flex:none}
.done .n{font-family:var(--serif);font-weight:800;color:var(--mark)}
.done.ck .txt{text-decoration:line-through;color:var(--muted)}
.note{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--muted);font-size:14px;margin:0}
h3.sec{margin:0;font-family:var(--serif);font-size:17px;font-weight:800}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-inline:8px;z-index:6}
.nav-in{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;padding:4px 0;border-radius:10px;color:var(--muted);font-size:12px}
nav button .no{width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
nav button .no svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{color:var(--accent);font-weight:700}
nav button[aria-current=page] .no{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.copybox{width:100%;min-height:160px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.card,.item{transition:border-color .15s}}
</style>

<div class="wrap">
  <header class="top"><div class="top-in">
    <button class="iconbtn" id="prev" aria-label="前一天"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="datebox"><div class="date" id="date"></div><div class="sub" id="status"></div></div>
    <button class="todaybtn" id="today">今天</button>
    <button class="iconbtn" id="next" aria-label="後一天"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div></header>
  <main id="main"></main>
</div>
<nav aria-label="五個步驟"><div class="nav-in" id="nav"></div></nav>

<script>
(function(){
'use strict';
var STEPS=[
 {k:'dump',n:'跑一遍',t:'先把今天在腦中跑一遍',d:'從早到晚想一次，浮出來的事都先寫下來，不用排序。寫下來之後，就不必一直怕漏掉。'},
 {k:'top',n:'三件事',t:'圈出今天最重要的三件事',d:'如果今天只能把三件事做好，會是哪三件？行程被打亂時，先守住這三件。'},
 {k:'time',n:'時間軸',t:'把固定行程先放進時間軸',d:'會議、課程、約定先放好，交通、吃飯、會前準備的時間也一起寫進去。'},
 {k:'gap',n:'小空檔',t:'替空檔安排一件小事',d:'十分鐘、二十分鐘的空檔，各寫一個做得完的小任務。'},
 {k:'buf',n:'留白',t:'預留空白，再回頭看一次',d:'每天都會有臨時狀況。留白讓行程有調整的餘地，最後用三個問題檢查一遍。'}
];
var KIND={fixed:'固定行程',prep:'準備・交通',buffer:'留白',gap:'空檔小事'};
var EXAMPLES=['上午十點開會','回覆家長訊息','確認活動場地','下午和店長討論人員安排','睡前讀半小時'];
var GAPIDEAS=['讀十頁書','回覆兩則重要訊息','走十分鐘換氣','寫下三個要談的重點','看一次學生的學習紀錄'];
var QS=[['q1','有沒有哪一段排得太趕？'],['q2','有沒有一件其實可以延後或交給別人處理？'],['q3','今天我有沒有留一點時間給自己和重要的人？']];

var $=function(id){return document.getElementById(id)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid6(){return Math.random().toString(36).slice(2,8)}
function pad(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseYmd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function mins(t){var p=t.split(':');return +p[0]*60+ +p[1]}
function hm(m){return pad(Math.floor(m/60))+':'+pad(m%60)}
function dur(m){return m>=60?(Math.floor(m/60)+' 小時'+(m%60?' '+(m%60)+' 分':'')):(m+' 分')}

/* ---------- data ---------- */
function emptyData(){return {v:1,dump:[],top:[],items:[],gapTasks:{},done:{},rv:{q1:'',q2:'',q3:''},sample:false}}
function sampleData(){
  var d=emptyData();
  var names=['上午十點核心會議','回覆家長訊息','確認活動場地','看完今天要分享的資料','下午和店長討論人員安排','晚上陪孩子上課','睡前讀半小時'];
  d.dump=names.map(function(t,i){return {id:'s'+i,text:t}});
  d.top=['s0','s1','s5'];
  d.items=[
   {id:'a1',kind:'prep',start:'08:30',end:'09:00',text:'交通到公司'},
   {id:'a2',kind:'prep',start:'09:15',end:'10:00',text:'會前整理資料'},
   {id:'a3',kind:'fixed',start:'10:00',end:'12:00',text:'核心與潛在股東會議'},
   {id:'a4',kind:'fixed',start:'12:00',end:'13:30',text:'跨部門協調會議'},
   {id:'a5',kind:'fixed',start:'13:30',end:'14:30',text:'各分店店長、組長幹部會議'},
   {id:'a6',kind:'fixed',start:'14:30',end:'15:30',text:'分區全體同仁會議'},
   {id:'a7',kind:'buffer',start:'16:00',end:'16:30',text:'留給臨時狀況'}
  ];
  d.gapTasks={'09:00':'車上讀的書再讀十頁','15:30':'寫下明天要談的三個重點'};
  d.sample=true;
  return d;
}
function sorted(items){return items.slice().sort(function(a,b){return mins(a.start)-mins(b.start)||mins(a.end)-mins(b.end)})}
function gapsOf(items){
  var s=sorted(items),out=[],reach=null;
  for(var i=0;i<s.length;i++){
    var st=mins(s[i].start),en=mins(s[i].end);
    if(reach!==null&&st-reach>=10)out.push({start:hm(reach),end:hm(st),len:st-reach});
    if(reach===null||en>reach)reach=en;
  }
  return out;
}

/* ---------- storage ---------- */
var S={date:ymd(new Date()),step:0,map:false,data:emptyData()};
var dayRef=null,pending=null,timer=null,chain=Promise.resolve(),loadTok=0;
var LKEY='mansiang:';
function lsGet(date){try{var v=localStorage.getItem(LKEY+date);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(date,d){try{localStorage.setItem(LKEY+date,JSON.stringify(d))}catch(e){}}
function setStatus(msg){$('status').textContent=msg}
function persist(date,snap){
  lsSet(date,snap);
  if(!dayRef){setStatus('已存在這台裝置');return}
  chain=chain.then(function(){return dayRef.doc(date).set(snap)}).then(function(){setStatus('已儲存')},function(){setStatus('已存在這台裝置，雲端儲存失敗')});
}
function flush(){
  if(timer){clearTimeout(timer);timer=null}
  if(pending){var p=pending;pending=null;persist(p.date,p.snap)}
}
function touch(){
  S.data.sample=false;
  var b=document.querySelector('.banner');if(b)b.remove();
  setStatus('儲存中…');
  pending={date:S.date,snap:JSON.parse(JSON.stringify(S.data))};
  if(timer)clearTimeout(timer);
  timer=setTimeout(flush,500);
}
async function loadDay(date){
  var tok=++loadTok;
  var remote=null;
  if(dayRef){try{var snap=await dayRef.doc(date).get();if(snap.exists)remote=snap.data()}catch(e){}}
  if(tok!==loadTok)return;
  var local=lsGet(date);
  var d=remote||local;
  if(d){S.data=Object.assign(emptyData(),JSON.parse(JSON.stringify(d)));S.data.sample=false;setStatus(remote?'已儲存':'已存在這台裝置')}
  else{
    var isToday=date===ymd(new Date());
    S.data=isToday?sampleData():emptyData();
    setStatus(isToday?'範例，尚未儲存':'尚無筆記');
  }
  render();
}
async function initStore(){
  try{
    if(!window.claude||!window.claude.use)return;
    var r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!r[0]||!r[1])return;
    var id=await r[1].id();
    if(!id)return;
    dayRef=r[0].doc('data/users/'+id+'/profile').collection('days');
    if(!pending)loadDay(S.date);
  }catch(e){}
}

/* ---------- render ---------- */
function bannerHtml(){
  return S.data.sample?'<div class="banner"><span>這是範例日。改動任何一項，就會變成你自己的筆記。</span><button data-act="clear">清空重寫</button></div>':'';
}
function head(i){var s=STEPS[i];return '<div><div class="stepno">第 '+(i+1)+' 步，共 5 步</div><h2>'+esc(s.t)+'</h2></div><p class="lead">'+esc(s.d)+'</p>'}

function vDump(){
  var d=S.data,h=head(0)+bannerHtml();
  h+='<form class="row-form" id="dumpForm"><input type="text" id="dumpIn" placeholder="例如：回覆家長訊息" autocomplete="off" aria-label="今天想到的事"><button class="btn" type="submit">加入</button></form>';
  if(!d.dump.length){
    h+='<div class="label">點一下加入範例</div><div class="chips">'+EXAMPLES.map(function(t){return '<button class="chip" data-act="addDump" data-t="'+esc(t)+'">'+esc(t)+'</button>'}).join('')+'</div>';
  }else{
    h+='<ul class="list">'+d.dump.map(function(x){return '<li class="item"><span class="txt">'+esc(x.text)+'</span><button class="del" data-act="delDump" data-id="'+x.id+'" aria-label="刪除：'+esc(x.text)+'">×</button></li>'}).join('')+'</ul>';
    h+='<p class="empty">共 '+d.dump.length+' 件。想完了，就到下一步圈出最重要的三件。</p>';
  }
  return h;
}
function vTop(){
  var d=S.data,h=head(1)+bannerHtml();
  h+='<div class="card" style="display:flex;align-items:center;gap:14px"><div class="counter">'+d.top.length+'/3</div><div class="lead">點選事項來圈選，再點一次取消。</div></div>';
  if(!d.dump.length){return h+'<p class="empty">還沒有事項可以選。先回到第一步寫下今天的事。</p><button class="btn ghost" data-act="go" data-i="0">回到第一步</button>'}
  h+='<div class="list">'+d.dump.map(function(x){
    var i=d.top.indexOf(x.id),on=i>=0,full=!on&&d.top.length>=3;
    return '<button class="pick" data-act="pick" data-id="'+x.id+'" aria-pressed="'+on+'" aria-disabled="'+full+'"><span class="ring">'+(on?(i+1):'')+'</span><span>'+esc(x.text)+'</span></button>';
  }).join('')+'</div>';
  return h;
}
function evRow(x,del){
  var s=mins(x.start),e=mins(x.end);
  return '<li class="ev '+x.kind+'"><div class="t"><b>'+x.start+'</b>'+x.end+'</div><div class="body"><span class="tag">'+KIND[x.kind]+'</span>'+esc(x.text)+(x.warn?'<div class="warn">與上一項時間重疊</div>':'')+'</div>'+(del?'<button class="del" data-act="delItem" data-id="'+x.id+'" aria-label="刪除：'+esc(x.text)+'">×</button>':'<span></span>')+'</li>';
}
function withWarn(items){
  var reach=-1;
  return sorted(items).map(function(x){var o=Object.assign({},x);o.warn=reach>mins(x.start);reach=Math.max(reach,mins(x.end));return o});
}
function vTime(){
  var d=S.data,h=head(2)+bannerHtml();
  h+='<form class="card" id="itemForm" style="display:flex;flex-direction:column;gap:10px">'+
    '<div class="seg" role="radiogroup" aria-label="類型">'+
    ['fixed','prep'].map(function(k,i){return '<label><input type="radio" name="kind" value="'+k+'"'+(i===0?' checked':'')+'><span>'+KIND[k]+'</span></label>'}).join('')+
    '<label><input type="radio" name="kind" value="buffer"><span>留白</span></label></div>'+
    '<div class="times"><label for="tStart">開始<input type="time" id="tStart" required value="09:00"></label><label for="tEnd">結束<input type="time" id="tEnd" required value="10:00"></label></div>'+
    '<input type="text" id="tText" placeholder="例如：跨部門協調會議" autocomplete="off" aria-label="行程內容" required>'+
    '<button class="btn" type="submit" style="width:100%">放進時間軸</button></form>';
  if(!d.items.length)return h+'<p class="empty">還沒有行程。填好時間與內容，按「放進時間軸」。</p>';
  h+='<div class="card"><ul class="tl">'+withWarn(d.items).map(function(x){return evRow(x,true)}).join('')+'</ul></div>';
  return h;
}
function vGap(){
  var d=S.data,h=head(3)+bannerHtml(),gs=gapsOf(d.items);
  if(d.items.length<2)return h+'<p class="empty">空檔要從時間軸算出來。先到第三步放入至少兩段行程。</p><button class="btn ghost" data-act="go" data-i="2">前往時間軸</button>';
  if(!gs.length)return h+'<p class="empty">目前的行程之間沒有 10 分鐘以上的空檔。</p>';
  h+='<p class="lead">找到 '+gs.length+' 段 10 分鐘以上的空檔。小任務要小到空檔裡真的做得完。</p>';
  h+=gs.map(function(g){
    var v=d.gapTasks[g.start]||'';
    return '<div class="card gapcard"><div class="gaphead"><b>'+g.start+'–'+g.end+'</b><span>'+dur(g.len)+'</span></div>'+
      '<input type="text" data-f="gap" data-k="'+g.start+'" value="'+esc(v)+'" placeholder="這段空檔做什麼？" aria-label="'+g.start+' 空檔的小任務" autocomplete="off">'+
      '<div class="chips">'+GAPIDEAS.map(function(t){return '<button class="chip" data-act="gapIdea" data-k="'+g.start+'" data-t="'+esc(t)+'">'+esc(t)+'</button>'}).join('')+'</div></div>';
  }).join('');
  return h;
}
function vBuf(){
  var d=S.data,h=head(4)+bannerHtml();
  var bs=d.items.filter(function(x){return x.kind==='buffer'});
  var total=bs.reduce(function(a,x){return a+Math.max(0,mins(x.end)-mins(x.start))},0);
  h+='<div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="stat"><span class="n">'+total+'</span><span class="lead">分鐘留白</span></div>'+
    (bs.length?'<ul class="tl">'+sorted(bs).map(function(x){return evRow(x,true)}).join('')+'</ul>':'<p class="empty">今天還沒有留白。臨時狀況來的時候，行程會沒有調整的餘地。</p>')+
    '<form id="bufForm" style="display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end">'+
    '<label for="bStart" class="label">開始<input type="time" id="bStart" required value="16:00"></label>'+
    '<label for="bLen" class="label">長度<select id="bLen"><option value="15">15 分</option><option value="30" selected>30 分</option><option value="45">45 分</option><option value="60">60 分</option></select></label>'+
    '<button class="btn" type="submit">加留白</button></form></div>';
  h+='<h3 class="sec">最後，從頭看一次今天</h3>';
  h+=QS.map(function(q){return '<div class="q"><h3>'+q[1]+'</h3><textarea data-f="rv" data-k="'+q[0]+'" id="rv-'+q[0]+'" placeholder="寫一兩句就好" aria-label="'+esc(q[1])+'">'+esc(d.rv[q[0]]||'')+'</textarea></div>'}).join('');
  return h;
}
function mergedTimeline(){
  var d=S.data,all=d.items.slice();
  gapsOf(d.items).forEach(function(g){var t=d.gapTasks[g.start];if(t&&t.trim())all.push({id:'g'+g.start,kind:'gap',start:g.start,end:g.end,text:t})});
  return sorted(all);
}
function mapText(){
  var d=S.data,L=[];
  L.push('一天漫想筆記　'+fmtDate(S.date));
  L.push('');L.push('今天最重要的三件事');
  if(!d.top.length)L.push('（尚未圈選）');
  d.top.forEach(function(id,i){var x=d.dump.filter(function(y){return y.id===id})[0];if(x)L.push((i+1)+'. '+x.text+(d.done[id]?'（完成）':''))});
  L.push('');L.push('時間軸');
  var tl=mergedTimeline();
  if(!tl.length)L.push('（尚未安排）');
  tl.forEach(function(x){L.push(x.start+'–'+x.end+'　['+KIND[x.kind]+'] '+x.text)});
  var rv=QS.filter(function(q){return (d.rv[q[0]]||'').trim()});
  if(rv.length){L.push('');L.push('回頭看一次');rv.forEach(function(q){L.push(q[1]);L.push('→ '+d.rv[q[0]].trim())})}
  return L.join('\n');
}
function vMap(){
  var d=S.data,h='<div><div class="stepno">今日地圖</div><h2>今天要走的路</h2></div>'+bannerHtml();
  h+='<h3 class="sec">最重要的三件事</h3>';
  var tops=d.top.map(function(id){return d.dump.filter(function(y){return y.id===id})[0]}).filter(Boolean);
  h+=tops.length?'<div class="card">'+tops.map(function(x,i){
    var ck=!!d.done[x.id];
    return '<label class="done'+(ck?' ck':'')+'"><input type="checkbox" data-f="done" data-k="'+x.id+'"'+(ck?' checked':'')+'><span class="n">'+(i+1)+'</span><span class="txt">'+esc(x.text)+'</span></label>';
  }).join('')+'</div>':'<p class="empty">還沒圈選。到第二步選出三件。</p>';
  h+='<h3 class="sec">時間軸</h3>';
  var tl=mergedTimeline();
  h+=tl.length?'<div class="card"><ul class="tl">'+tl.map(function(x){return evRow(x,false)}).join('')+'</ul></div>':'<p class="empty">還沒有行程。到第三步放入固定行程。</p>';
  var rv=QS.filter(function(q){return (d.rv[q[0]]||'').trim()});
  if(rv.length){h+='<h3 class="sec">回頭看一次</h3><div class="card" style="display:flex;flex-direction:column;gap:10px">'+rv.map(function(q){return '<div><div class="label">'+esc(q[1])+'</div><p class="note">'+esc(d.rv[q[0]])+'</p></div>'}).join('')+'</div>'}
  h+='<button class="btn" data-act="copy" style="width:100%">複製成文字</button><div id="copyOut"></div>';
  return h;
}
function fmtDate(s){return parseYmd(s).toLocaleDateString('zh-TW',{month:'long',day:'numeric',weekday:'short'})}
function render(){
  $('date').textContent=fmtDate(S.date);
  var v=S.map?vMap():[vDump,vTop,vTime,vGap,vBuf][S.step]();
  $('main').innerHTML=v;
  var nav=STEPS.map(function(s,i){return '<button data-act="go" data-i="'+i+'"'+(!S.map&&S.step===i?' aria-current="page"':'')+'><span class="no">'+(i+1)+'</span><span>'+s.n+'</span></button>'}).join('')+
   '<button data-act="map"'+(S.map?' aria-current="page"':'')+'><span class="no"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg></span><span>地圖</span></button>';
  $('nav').innerHTML=nav;
}

/* ---------- actions ---------- */
function go(i){S.step=i;S.map=false;render();window.scrollTo(0,0)}
function shiftDay(n){
  flush();
  var d=parseYmd(S.date);d.setDate(d.getDate()+n);S.date=ymd(d);
  loadDay(S.date);window.scrollTo(0,0);
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el){return}
  var a=el.getAttribute('data-act'),d=S.data;
  if(a==='go'){go(+el.getAttribute('data-i'))}
  else if(a==='map'){S.map=true;render();window.scrollTo(0,0)}
  else if(a==='clear'){S.data=emptyData();touch();render()}
  else if(a==='addDump'){d.dump.push({id:uid6(),text:el.getAttribute('data-t')});touch();render()}
  else if(a==='delDump'){var id=el.getAttribute('data-id');d.dump=d.dump.filter(function(x){return x.id!==id});d.top=d.top.filter(function(x){return x!==id});touch();render()}
  else if(a==='pick'){
    var pid=el.getAttribute('data-id'),i=d.top.indexOf(pid);
    if(i>=0)d.top.splice(i,1);else if(d.top.length<3)d.top.push(pid);else return;
    touch();render();
  }
  else if(a==='delItem'){var iid=el.getAttribute('data-id');d.items=d.items.filter(function(x){return x.id!==iid});touch();render()}
  else if(a==='gapIdea'){d.gapTasks[el.getAttribute('data-k')]=el.getAttribute('data-t');touch();render()}
  else if(a==='copy'){copyText(mapText())}
});
$('prev').addEventListener('click',function(){shiftDay(-1)});
$('next').addEventListener('click',function(){shiftDay(1)});
$('today').addEventListener('click',function(){flush();S.date=ymd(new Date());loadDay(S.date)});

document.addEventListener('input',function(e){
  var el=e.target,f=el.getAttribute&&el.getAttribute('data-f');
  if(!f)return;
  var k=el.getAttribute('data-k'),d=S.data;
  if(f==='gap'){if(el.value.trim())d.gapTasks[k]=el.value;else delete d.gapTasks[k]}
  else if(f==='rv'){d.rv[k]=el.value}
  touch();
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.getAttribute&&el.getAttribute('data-f')==='done'){
    var k=el.getAttribute('data-k');
    if(el.checked)S.data.done[k]=true;else delete S.data.done[k];
    touch();
    var lab=el.closest('.done');if(lab)lab.classList.toggle('ck',el.checked);
  }
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  var f=e.target,d=S.data;
  if(f.id==='dumpForm'){
    var inp=$('dumpIn'),t=inp.value.trim();
    if(!t)return;
    d.dump.push({id:uid6(),text:t});touch();render();
    var n=$('dumpIn');if(n)n.focus();
  }else if(f.id==='itemForm'){
    var kind=f.querySelector('input[name=kind]:checked').value;
    var st=$('tStart').value,en=$('tEnd').value,tx=$('tText').value.trim();
    if(!st||!en||!tx)return;
    if(mins(en)<=mins(st)){en=hm(Math.min(mins(st)+30,1439))}
    d.items.push({id:uid6(),kind:kind,start:st,end:en,text:tx});touch();render();
  }else if(f.id==='bufForm'){
    var bs=$('bStart').value,len=+$('bLen').value;
    if(!bs)return;
    var end=Math.min(mins(bs)+len,1439);
    d.items.push({id:uid6(),kind:'buffer',start:bs,end:hm(end),text:'留白'});touch();render();
  }
});

function copyText(t){
  var out=$('copyOut');
  function fallback(){
    out.innerHTML='<textarea class="copybox" id="copyArea" readonly aria-label="今日筆記文字"></textarea>';
    var ta=$('copyArea');ta.value=t;ta.focus();ta.select();
  }
  try{
    navigator.clipboard.writeText(t).then(function(){out.innerHTML='<p class="empty" role="status">已複製，可以貼到任何筆記或訊息。</p>'},fallback);
  }catch(e){fallback()}
}

/* ---------- boot ---------- */
render();
loadDay(S.date);
initStore();
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
