name: 果果日記安全規則
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'test＝只在模擬雲端測試；check＝測試＋讀出目前上線的規則；deploy＝測試全過才上線'
        type: choice
        options: [test, check, deploy]
        default: test
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scripts/guoguo-rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - name: 在模擬雲端測試規則
        run: npx firebase emulators:exec --only firestore --project demo-gg "node test.mjs"
      - name: 讀出目前上線的規則
        if: inputs.mode != 'test'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: node current.mjs
      - name: 上線新規則
        if: inputs.mode == 'deploy'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          P=$(node -e "console.log(JSON.parse(process.env.FIREBASE_SA).project_id)")
          npx firebase deploy --only firestore:rules --project "$P" --non-interactive
          echo "::notice::rules deployed to $P"
          rm -f "$RUNNER_TEMP/sa.json"
